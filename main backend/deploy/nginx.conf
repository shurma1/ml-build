# ---------------------------------------------------------------------------
# Рабочее место оператора и core-api на ОДНОМ источнике.
#
# Так решаются сразу три вещи:
#   * токен рабочего места не попадает в браузер — его дописывает прокси;
#   * не нужен CORS: фронт ходит относительными путями /v1/…;
#   * WebSocket идёт тем же путём, что и остальное, и получает тот же заголовок.
#
# Ключевой момент — X-Forwarded-Host: без него core-api вернёт в `ws_url`
# адрес апстрима (127.0.0.1:8080), браузер пойдёт по нему мимо прокси, мимо
# подстановки токена, и соединение будет отклонено.
# ---------------------------------------------------------------------------

upstream core_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name mfc.example.ru;

    ssl_certificate     /etc/ssl/mfc/fullchain.pem;
    ssl_certificate_key /etc/ssl/mfc/privkey.pem;

    # Токен рабочего места живёт ЗДЕСЬ и больше нигде: ни в сборке фронта,
    # ни в браузере. Файл читается только nginx.
    include /etc/nginx/secrets/api_token.conf;   # set $api_token "…";

    # --- статика рабочего места ---
    root /srv/mfc/dist;
    index index.html;

    location / {
        try_files $uri /index.html;              # маршрутизация на стороне клиента
    }

    # Хэш (#/gateway) до сервера не доходит вовсе — отдельного правила не нужно.

    # --- API ---
    location /v1/ {
        proxy_pass http://core_api;
        proxy_http_version 1.1;

        # ← подстановка токена: браузер его не знает и знать не должен
        proxy_set_header Authorization "Bearer $api_token";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;   # иначе ws_url укажет на апстрим
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # WebSocket рукопожатие: тот же location, те же заголовки
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Поток событий и SSE не должны буферизоваться
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- настройка ML-сервера ---
    # Роут закрыт своим секретом (X-Admin-Secret, сравнение за константное
    # время), но он меняет адрес шлюза в базе, поэтому разумно сузить и по сети.
    # Токен рабочего места сюда НЕ подставляется: админ-роут его не проверяет.
    location /v1/admin/ {
        allow 10.0.0.0/8;                        # сеть администраторов
        deny  all;

        proxy_pass http://core_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name mfc.example.ru;
    return 301 https://$host$request_uri;
}
